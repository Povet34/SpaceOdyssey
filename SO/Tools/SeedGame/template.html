<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>씨앗 게임</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#10141b;--panel:#171d27;--panel2:#1e2633;--line:#2b3545;--text:#dfe6ee;--dim:#8b98a9;--accent:#4fd0c8;
  --err:#ff5d5d;--warn:#f2c14e;--ok:#5fd38a;--gold:#f5c542}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:grid;
  grid-template:52px 1fr/330px 1fr 380px;grid-template-areas:"top top top" "left center right";overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled,select:disabled,input:disabled{opacity:.45;cursor:not-allowed}
select{background:#0d1118;border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:150px}
header{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sp{flex:1}
#left,#right{background:var(--panel);overflow:auto;padding:14px 16px;min-height:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
#center{grid-area:center;overflow:auto;padding:18px 24px;min-height:0}
h2{font-size:14px;margin:0 0 10px;color:var(--dim)}
h3{font-size:13px;margin:0 0 6px;color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.note{color:var(--warn);font-size:13px;margin:6px 0}
.rev{font-size:13px;margin:8px 0 12px;padding:6px 8px;border-radius:6px;background:var(--panel2)}
.rev.on{border-left:3px solid var(--ok)}.rev.off{border-left:3px solid var(--dim)}
.grp{margin:12px 0 4px;font-size:12px;color:var(--dim);font-weight:600}
.hold{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.hold small{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:760px}
.badge{display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.badge.열림{color:var(--gold);border-color:var(--gold)}.badge.풀림{color:var(--ok);border-color:var(--ok)}
.badge.방치{color:var(--warn);border-color:var(--warn)}.badge.놓침{color:var(--err);border-color:var(--err)}
.badge.거절{color:var(--dim);border-color:var(--dim)}
.question{font-size:19px;font-weight:600;margin:12px 0 4px}
.lines{color:var(--dim);font-size:13px;margin:0 0 12px}
.story{margin:12px 0}
.discovery{padding:10px 14px;border-left:3px solid var(--accent);background:var(--panel2)}
.general{padding:8px 12px;border-left:3px solid var(--dim);background:var(--panel2);margin:10px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.opt{text-align:left;padding:9px 16px}
.opt b{display:block}
.opt em{display:block;color:var(--warn);font-size:12px;font-style:normal;margin-top:3px}
.outcome{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--panel2)}
.outcome b{color:var(--accent)}
.fail{background:#3a1416;border:2px solid var(--err);border-radius:10px;padding:18px 22px;font-size:17px;max-width:760px;margin-bottom:14px}
.fail b{display:block;font-size:22px;margin-bottom:6px;color:var(--err)}
.author{margin-top:22px;max-width:760px}
.panel{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:#131923}
.panel dl{margin:0}.panel dt{color:var(--dim);font-size:12px;margin-top:6px}.panel dd{margin:0}
.panel ul{margin:4px 0;padding-left:18px}
.panel pre{white-space:pre-wrap;font:12px/1.5 Consolas,"Malgun Gothic",monospace;margin:0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}
#log{list-style:none;margin:0;padding:0}
#log li{padding:6px 0;border-bottom:1px solid var(--line)}
#log .au{color:var(--dim);display:block;font-size:12px}
#log li.dim{color:var(--dim)}
</style>
</head>
<body>
<header id="top"></header>
<aside id="left"></aside>
<main id="center"></main>
<aside id="right"></aside>
<script>/*__ENGINE__*/</script>
<script>
'use strict';
// 가진 것 패널(수단 상태 선택)과 프리셋 버튼은 1단계 시험 장치다. 2단계의 능력 목록 화면이 아니다.
const DATA = /*__DATA__*/null;

// 사이드카가 정상이 아니면 DATA.playable이 거짓이고 human, meta 등이 없다(사람이 쓴 문구가 없어 플레이하지 않음).
const ctx = { seed: DATA.seed, human: DATA.human, sidecar: DATA.sidecar, meta: DATA.meta, holdings: null };
let st = Engine.start();
let author = false;
let failure = null; // 주소나 행동의 오류. 있으면 화면은 멈춘 채 오류를 크게 보인다.
let presetNote = '';

// 요소 만들기. 글은 textContent로만 넣는다. 조건부로 안 그릴 자식은 null로 넘긴다.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false) el.setAttribute(k, v);
  });
  kids.flat(Infinity).filter(k => k !== null).forEach(k => el.append(k));
  return el;
}

// 자식 목록(배열이 섞여도, 안 그릴 자리는 null이어도 됨)으로 요소 내용을 통째로 바꾼다.
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null));
}

function applyPreset(name) {
  ctx.holdings = Engine.presetHoldings(name, DATA);
  if (name !== 'kit') return '';
  const r = Engine.reviewOpen(ctx.human.review, ctx.meta, ctx.holdings);
  return r.open
    ? '출발 장비만으로 검토 능력이 이미 있음 (가동: ' + r.by.join(', ') + ')'
    : '출발 장비만으로는 검토 능력이 없음 (검토 능력 수단: ' + ctx.human.review.means.join(', ') + ')';
}

// 주소 조각(#preset=...&do=accept,review,...&author=1)을 읽어 시작 상태를 만든다. 모르는 프리셋이나 행동이면 오류로 멈춘다.
try {
  const link = Engine.parseLink(location.hash);
  author = link.author;
  if (DATA.playable) {
    presetNote = applyPreset(link.preset);
    link.actions.forEach(a => { st = Engine.applyAction(st, ctx, a); });
  } else if (link.preset !== 'none' || link.actions.length > 0) {
    throw new Error('플레이할 수 없는 상태라 시험용 링크의 preset과 do를 쓸 수 없음');
  }
} catch (e) {
  failure = e.message;
}
// 주소 조각을 고치고 엔터를 치면 새로 읽는다.
window.addEventListener('hashchange', () => location.reload());

function act(fn) {
  try { fn(); } catch (e) { failure = e.message; }
  render();
}

function failBox() {
  return h('div', { class: 'fail' }, h('b', {}, '오류, 멈춤'), failure, h('div', { class: 'dim' }, '주소 조각을 고쳐 다시 열 것.'));
}

function render() {
  try {
    draw();
  } catch (e) {
    failure = e.message;
    ['top', 'left', 'center', 'right'].forEach(id => fill(document.getElementById(id)));
    fill(document.getElementById('center'), failBox());
  }
}

function draw() {
  if (!DATA.playable) {
    drawUnplayable();
    return;
  }
  const frozen = failure !== null;
  drawTop(frozen);
  if (ctx.holdings === null) {
    ['left', 'right'].forEach(id => fill(document.getElementById(id)));
    fill(document.getElementById('center'), failBox());
    return;
  }
  drawLeft(frozen);
  drawCenter(frozen);
  drawLog();
}

function authorBox(frozen) {
  return h('label', {}, h('input', { type: 'checkbox', checked: author, disabled: frozen, onchange: e => { author = e.target.checked; render(); } }), '작성자 보기');
}

function drawTop(frozen) {
  fill(document.getElementById('top'),
    h('h1', {}, '씨앗 게임 1단계 — ' + DATA.seed.title),
    authorBox(frozen),
    h('span', { class: 'sp' }),
    h('button', { title: '받기 전에는 방치가 일어나지 않아 쓸 수 없음', disabled: frozen || st.status !== '열림' || !st.accepted || ctx.holdings === null, onclick: () => act(() => { st = Engine.applyAction(st, ctx, 'close'); }) }, '방치로 닫기(수동)'),
    h('button', { title: '사건과 일지만 처음으로. 가진 것은 그대로', disabled: frozen, onclick: () => act(() => { st = Engine.start(); }) }, '처음부터'));
}

// 사람이 쓴 문구가 없어 플레이하지 않는다. 작성자 보기에서만 원문을 본다(원문을 이야기처럼 플레이 보기에 내지 않음).
function drawUnplayable() {
  fill(document.getElementById('top'), h('h1', {}, '씨앗 게임 1단계 — ' + DATA.seed.title), authorBox(false));
  fill(document.getElementById('left'));
  fill(document.getElementById('right'));
  fill(document.getElementById('center'),
    h('div', { class: 'fail' }, h('b', {}, '플레이할 수 없음'), DATA.reason, failure !== null ? h('div', {}, failure) : null),
    author ? drawAuthor(false) : null);
}

function drawLeft(frozen) {
  const r = Engine.reviewOpen(ctx.human.review, ctx.meta, ctx.holdings);
  const means = ctx.human.review.means;
  const revText = means.length === 0
    ? '검토 능력: 목록이 비어 있어 능력 검토가 열리지 않음'
    : r.open ? '검토 능력: 있음 (가동: ' + r.by.join(', ') + ')' : '검토 능력: 없음 (' + means.join(' 또는 ') + ' 중 하나가 가동이어야 함)';
  function row(n) {
    const opts = Engine.holdOptions(ctx.meta[n], DATA.tags[n]);
    return h('div', { class: 'hold' }, h('span', {}, n, ' ', h('small', {}, '(' + ctx.meta[n].cat + ')')),
      h('select', { disabled: frozen, onchange: e => { ctx.holdings = Object.assign({}, ctx.holdings, { [n]: e.target.value }); presetNote = ''; render(); } },
        opts.map(o => h('option', { value: o, selected: ctx.holdings[n] === o }, o))));
  }
  // 플레이 보기는 검토 능력 수단만 그린다. 길 요구의 수단 이름은 숨긴 길을 가리키므로 작성자 보기에서만 그린다.
  const rest = Engine.panelNames(DATA, author).filter(n => !means.includes(n));
  const reqNames = DATA.seed.paths.flatMap(p => p.means.map(r => r.name));
  const inPaths = rest.filter(n => reqNames.includes(n));
  const presetOnly = rest.filter(n => !reqNames.includes(n));
  const presets = [['kit', '출발 장비'], ['none', '아무것도 없음'], ['ability', '능력 있음 예시']];
  fill(document.getElementById('left'),
    h('h2', {}, '가진 것 (수동, 1단계 시험용)'),
    h('div', { class: 'presets' }, presets.map(([name, label]) =>
      h('button', { disabled: frozen, onclick: () => act(() => { presetNote = applyPreset(name); }) }, label))),
    presetNote ? h('div', { class: 'note' }, presetNote) : null,
    h('div', { class: 'rev ' + (r.open ? 'on' : 'off') }, revText),
    h('div', { class: 'grp' }, '검토 능력 수단'), means.map(row),
    author ? [h('div', { class: 'grp' }, '이 씨앗의 길 요구에 나오는 수단'), inPaths.map(row)] : h('div', { class: 'note' }, '나머지 가진 것은 프리셋이 정함 (작성자 보기에서 보임)'),
    presetOnly.length ? [h('div', { class: 'grp' }, '프리셋에만 쓰이는 수단 (이 씨앗에서는 효과 없음)'), presetOnly.map(row)] : null);
}

function drawCenter(frozen) {
  const v = Engine.publicView(st, ctx);
  const card = h('section', { class: 'card' },
    h('span', { class: 'badge ' + v.status }, v.status === '놓침' ? '놓침(못 알아봄)' : v.status),
    h('div', { class: 'question' }, v.question),
    h('div', { class: 'lines' }, v.lines.map(l => h('div', {}, l))),
    v.afterAccept ? h('p', { class: 'story' }, v.afterAccept) : null,
    v.general ? h('div', { class: 'general' }, v.general) : null,
    v.discovery ? h('p', { class: 'story discovery' }, v.discovery) : null);
  if (v.options.length) {
    card.append(h('div', { class: 'opts' }, v.options.map(o => h('button', { class: 'opt', disabled: frozen, onclick: () => act(() => { st = Engine.applyAction(st, ctx, o.act); }) },
      h('b', {}, o.label), o.mount ? h('em', {}, o.mount) : null))));
  }
  if (v.outcome) {
    // 방치 원문과 결 낱말은 작성자 보기에서만 회색으로 그린다(플레이 보기 view에는 없음).
    const note = author ? Engine.neglectNote(st, ctx) : null;
    card.append(h('div', { class: 'outcome' }, h('b', {}, '여파: ' + v.outcome.title),
      v.outcome.process ? h('div', { class: 'dim' }, v.outcome.process) : null,
      h('div', { class: v.outcome.dim ? 'dim' : '' }, v.outcome.result),
      v.outcome.left ? h('div', {}, '남는 것: ' + v.outcome.left) : null,
      note ? h('div', { class: 'dim' }, note.label + ' (방치 결: ' + note.tone + '): ' + note.text) : null));
  }
  const kids = frozen ? [failBox(), card] : [card];
  if (author) kids.push(drawAuthor(true));
  fill(document.getElementById('center'), kids);
}

function box(title, ...kids) {
  return h('section', { class: 'panel' }, h('h3', {}, title), ...kids);
}

// 작성자 보기. playable이 거짓이면 사람이 쓴 문구와 가진 것이 없으니 원문과 길 요구, 사이드카 상태, 보고만 보인다.
function drawAuthor(playable) {
  const s = ctx.seed;
  const sc = DATA.sidecar;
  const a = playable ? Engine.authorView(ctx) : null;
  const dl = rows => h('dl', {}, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));
  const pathRows = s.paths.map((p, i) => {
    const f = playable ? a.paths[i] : null;
    const head = (i + 1) + '. ' + p.name + (playable && f.label !== p.name ? ' (플레이 보기 이름: ' + f.label + ')' : '') + ' — 요구: ' + Engine.requirementText(p);
    return h('li', {}, head,
      playable ? [' → ', h('span', { class: f.ok ? 'ok' : 'bad' }, f.ok ? '채움' : '못 채움'), f.mounts.length ? ' (' + Engine.MOUNT_NOTE + ': ' + f.mounts.join(', ') + ')' : ''] : null,
      playable && !f.ok ? h('div', { class: 'dim' }, '모자란 것: ' + f.parts.filter(x => !x.ok).map(x => x.reason).join('; ')) : null,
      h('div', { class: 'dim' }, '과정: ' + p.process), h('div', { class: 'dim' }, '결과: ' + p.result), h('div', { class: 'dim' }, '남는 것: ' + p.left));
  });
  const kids = [
    box('씨앗 열쇠와 지문과 사이드카', dl([
      ['열쇠', s.key + ' (시기 ' + s.eras + ', 노리는 곳 ' + s.targets.join(', ') + ')'],
      ['문서 지문', sc.fingerprintDoc], ['사이드카 지문', sc.fingerprintSidecar || '(없음)'],
      ['사이드카 상태', h('span', { class: sc.state === '정상' ? 'ok' : 'bad' }, sc.state)]])),
    box('원문', dl([['사정', s.sajeong], ['징후 1', s.sign1], ['징후 2', s.sign2], ['걸림돌', s.obstacle], ['맨손', s.bare], ['방치', s.ignore]])),
    box('길 ' + s.paths.length + '개: 요구와 채움', h('ul', {}, pathRows)),
  ];
  if (playable) {
    const hu = ctx.human;
    const effects = Object.entries(sc.effects).map(([name, list]) => h('li', {}, name, h('ul', {}, list.map(e => h('li', {}, Engine.describeEffect(e), h('span', { class: 'dim' }, '  — 근거: ' + e['근거']))))));
    kids.push(
      box('사이드카 문구 (사람이 쓴 것, JSON에서 고침)', dl([
        ['surface (질문)', hu.surface], ['surface_lines', hu.surface_lines.join(' / ')], ['after_accept', hu.after_accept],
        ['decline_result', hu.decline_result], ['discovery', hu.discovery],
        ['path_labels', Object.entries(hu.path_labels).map(([k, v]) => k + ' → ' + v).join(' / ')]])),
      box('검토 능력 (' + hu.review.status + ')', h('div', {}, '목록: ' + (a.review.means.join(', ') || '(비어 있음)')),
        h('div', { class: a.review.open ? 'ok' : 'bad' }, a.review.open ? '지금 열림 (가동: ' + a.review.by.join(', ') + ')' : '지금 안 열림')),
      box('효과층 초안 (검토: ' + sc.checked + ', 게임은 "됨"만 씀)', h('ul', {}, effects)));
  }
  kids.push(box('내보내기 보고', h('pre', {}, DATA.report)));
  return h('div', { class: 'author' }, kids);
}

function drawLog() {
  const items = st.log.map(e => h('li', { class: e.dim ? 'dim' : '' }, e.text, author && e.author ? h('span', { class: 'au' }, '작성자: ' + e.author) : null));
  fill(document.getElementById('right'), h('h2', {}, '일지'),
    items.length ? h('ol', { id: 'log' }, items) : h('div', { class: 'dim' }, '아직 아무 일도 없음'));
}

render();
</script>
</body>
</html>
